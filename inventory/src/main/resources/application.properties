spring.application.name=inventory
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${WEB_PORT:8740}
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:33316}/inventory?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=inventory
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
spring.mvc.problemdetails.enabled=true
logging.structured.format.console=ecs
app.photos=${PHOTO_DIR:./data/photos}
app.imaging=${IMAGING_URL:http://127.0.0.1:8741}

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Preserve original host/proxy headers so the local-only boundary can reject proxies.
server.forward-headers-strategy=none
