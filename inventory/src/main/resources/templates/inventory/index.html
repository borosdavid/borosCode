<!doctype html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#183d33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Otthontár"><link rel="manifest" th:href="@{/manifest.webmanifest}"><link rel="apple-touch-icon" th:href="@{/icons/icon-180.png}"><script defer th:src="@{/auth.js}"></script><script defer th:src="@{/photo-input.js}"></script><script defer th:src="@{/pwa.js}"></script><title>Költözési leltár · Otthontár</title><link rel="stylesheet" th:href="@{/inventory.css}"><script defer th:src="@{/inventory.js}"></script></head>
<body th:attr="data-app-root=@{/},data-upload-limit-mib=${uploadLimitMiB}"><header th:replace="~{layout :: header}"></header>
<main><nav class="tabs" aria-label="Leltár"><a th:href="@{/leltar}">Tárgyak</a><a th:href="@{/leltar/eladas}">Eladás</a><a th:href="@{/leltar/koltoztetes}">Költöztetés</a><a th:href="@{/leltar/beallitasok}">Beállítások</a><a th:href="@{/leltar/lomtar}">Lomtár</a></nav>
<aside class="pwa-info" aria-label="Kapcsolat és telepítés"><p id="connection-status" role="status"></p><details><summary>Telepítés iPhone-ra</summary><p id="pwa-help"></p></details><p id="pwa-update" role="status" hidden></p></aside><p id="message" role="alert" hidden></p><section id="content" aria-live="polite">Betöltés…</section></main>
<dialog id="sale-dialog" aria-labelledby="sale-title">
<form>
<h2 id="sale-title">Eladás rögzítése</h2><p class="item-name"></p>
<label>Tényleges eladási ár (Ft)<input name="actual" type="number" min="0" max="999999999999.99" step="0.01" required autofocus></label>
<label>Eladás dátuma<input name="soldDate" type="date" required></label>
<p role="alert" hidden></p>
<div class="actions"><button type="button">Mégse</button><button class="primary">Mentés</button></div>
</form>
</dialog>
<template id="editor"><form id="itemform"><div class="heading"><h1>Tárgy adatlapja</h1><button class="primary">Mentés</button></div>
<fieldset><legend>Tárgy adatai</legend><label>Név<input name="name" maxlength="200" required></label>
<label>Helyszín<select name="location" required></select></label><label class="wide">Leírás<textarea name="description" maxlength="12000" rows="3"></textarea></label></fieldset>
<fieldset><legend>Tervezett művelet</legend><label>Művelet<select name="actionId"></select></label><label data-move hidden>Célhelyszín<select name="destination"></select></label><button data-complete hidden type="button">Áthelyezés végrehajtása</button><label data-sale hidden>Eladási állapot<select name="status"><option value="WAIT">Meghirdetésre vár</option><option value="LISTED">Meghirdetve</option><option value="SOLD">Elkelt</option></select></label>
<label data-sale hidden>Irányár (Ft)<input name="asking" type="number" min="0" step=".01"></label><label data-sale hidden>Marketplace-link<input name="link" type="url"></label><label data-sold hidden>Tényleges ár (Ft)<input name="actual" type="number" min="0" step=".01"></label><label data-sold hidden>Eladás dátuma<input name="soldDate" type="date"></label></fieldset>
<fieldset><legend>Fotók</legend><label class="wide">Fotók kiválasztása<input id="picker" type="file" accept="image/*,.heic,.heif" multiple></label><label class="wide">Fotó készítése<input id="camera" type="file" accept="image/*" capture="environment"></label><p class="wide">A fotók online menthetők. Legfeljebb 20 MiB/kép és <span th:text="${uploadLimitMiB}">200</span> MiB/mentés. HEIC esetén JPEG-átalakítás szükséges. A nem mentett képek csak ezen a nyitott lapon maradnak meg.</p><div id="gallery" class="gallery wide"></div></fieldset>
<section id="conflict" hidden></section><button class="primary">Mentés</button> <a th:href="@{/leltar}">Vissza a leltárhoz</a></form></template></body></html>
