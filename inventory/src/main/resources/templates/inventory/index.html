<!doctype html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Költözési leltár · Otthontár</title><link rel="stylesheet" th:href="@{/inventory.css}"><script defer th:src="@{/inventory.js}"></script></head>
<body><header th:replace="~{layout :: header}"></header>
<main><nav class="tabs" aria-label="Leltár"><a href="/leltar">Tárgyak</a><a href="/leltar/eladas">Eladás</a><a href="/leltar/koltoztetes">Költöztetés</a><a href="/leltar/beallitasok">Beállítások</a><a href="/leltar/lomtar">Lomtár</a></nav>
<p id="message" role="alert" hidden></p><section id="content" aria-live="polite">Betöltés…</section></main>
<dialog id="sale-dialog" aria-labelledby="sale-title">
<form>
<h2 id="sale-title">Eladás rögzítése</h2><p class="item-name"></p>
<label>Tényleges eladási ár (Ft)<input name="actual" type="number" min="0" max="999999999999.99" step="0.01" required autofocus></label>
<label>Eladás dátuma<input name="soldDate" type="date" required></label>
<p role="alert" hidden></p>
<div class="actions"><button type="button">Mégse</button><button class="primary">Mentés</button></div>
</form>
</dialog>
<template id="editor"><form id="itemform"><div class="heading"><h1>Tárgy adatlapja</h1><button class="primary">Mentés</button></div>
<fieldset><legend>Tárgy adatai</legend><label>Név<input name="name" maxlength="200" required></label>
<label>Helyszín<select name="location" required></select></label><label class="wide">Leírás<textarea name="description" maxlength="12000" rows="3"></textarea></label></fieldset>
<fieldset><legend>Tervezett művelet</legend><label>Művelet<select name="actionId"></select></label><label data-move hidden>Célhelyszín<select name="destination"></select></label><button data-complete hidden type="button">Áthelyezés végrehajtása</button><label data-sale hidden>Eladási állapot<select name="status"><option value="WAIT">Meghirdetésre vár</option><option value="LISTED">Meghirdetve</option><option value="SOLD">Elkelt</option></select></label>
<label data-sale hidden>Irányár (Ft)<input name="asking" type="number" min="0" step=".01"></label><label data-sale hidden>Marketplace-link<input name="link" type="url"></label><label data-sold hidden>Tényleges ár (Ft)<input name="actual" type="number" min="0" step=".01"></label><label data-sold hidden>Eladás dátuma<input name="soldDate" type="date"></label></fieldset>
<fieldset><legend>Fotók</legend><label class="wide">JPG-k hozzáadása<input id="picker" type="file" accept=".jpg,.jpeg,image/jpeg" multiple></label><div id="gallery" class="gallery wide"></div></fieldset>
<section id="conflict" hidden></section><button class="primary">Mentés</button> <a href="/leltar">Vissza a leltárhoz</a></form></template></body></html>
